name: movie_cf_pipeline
uuid: movie_cf_pipeline
type: python
description: >
  CF flow: load ratings from Postgres -> train SVD (surprise) + ALS (implicit),
  normalise both to 0-1 and blend (0.4*SVD + 0.6*ALS), write Top-20/user to
  data/gold/cf_predictions.csv -> push per-movie cf_recommendations to
  Elasticsearch.
